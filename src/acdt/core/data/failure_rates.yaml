# Failure-rate database for the low-fidelity ARP4761 assessment (acdt.core.safety).
# Every entry: lambda_per_h (constant rate, 1/h), mtbf_h, kind, source, url, note.
#   kind: published      — value read from a public report/table
#         vendor_claim   — manufacturer statement (not independently verified)
#         assumption     — PRESSUPOSTO: no public source found; replace with supplier / field data.
# No values are invented without the "assumption" label; the assessment always reports the MTBF that a component
# would NEED to meet each target, so assumptions can be replaced quickly.
_sources:
  nasa_gars: &nasa
    source: "NASA/CR-2001-210647 (Pettit & Turnbull 2001), General Aviation Aircraft Reliability Study, Appendix A Table A1 (MTBF from repair-station data)"
    url: "https://ntrs.nasa.gov/citations/20010069394"
  atsb: &atsb
    source: "ATSB AR-2013-107, Engine failures and malfunctions in light aeroplanes 2009-2014 (rate per 10 000 h, failures OR malfunctions)"
    url: "https://www.atsb.gov.au/publications/research-and-analysis-report/2022/aviation/engine-failures-and-malfunctions-light"

components:
  # ---------------- GA instruments / electrical (NASA GARS Table A1) ----------------
  airspeed_indicator: {mtbf_h: 18100, lambda_per_h: 5.52e-5, kind: published, <<: *nasa}
  altimeter:          {mtbf_h: 5500,  lambda_per_h: 1.82e-4, kind: published, <<: *nasa}
  alternator:         {mtbf_h: 7600,  lambda_per_h: 1.32e-4, kind: published, <<: *nasa}
  attitude_indicator: {mtbf_h: 2500,  lambda_per_h: 4.00e-4, kind: published, <<: *nasa}
  directional_gyro:   {mtbf_h: 3400,  lambda_per_h: 2.94e-4, kind: published, <<: *nasa}
  turn_coordinator:   {mtbf_h: 2100,  lambda_per_h: 4.76e-4, kind: published, <<: *nasa}
  vacuum_pump:        {mtbf_h: 4000,  lambda_per_h: 2.50e-4, kind: published, <<: *nasa, note: "asterisk in Table A1 (see report)"}
  pitot_tube:         {mtbf_h: 73600, lambda_per_h: 1.36e-5, kind: published, <<: *nasa, note: "asterisk in Table A1"}
  comm_radio:         {mtbf_h: 900,   lambda_per_h: 1.11e-3, kind: published, <<: *nasa, note: "asterisk in Table A1"}
  transponder:        {mtbf_h: 1700,  lambda_per_h: 5.88e-4, kind: published, <<: *nasa, note: "asterisk in Table A1"}
  vertical_speed_indicator: {mtbf_h: 14500, lambda_per_h: 6.90e-5, kind: published, <<: *nasa, note: "Table A1 prints 6.90E-06; 1/MTBF = 6.90e-5 used"}
  tachometer:         {mtbf_h: 8400,  lambda_per_h: 1.19e-4, kind: published, <<: *nasa}
  oil_press_temp_gauge: {mtbf_h: 6200, lambda_per_h: 1.61e-4, kind: published, <<: *nasa}
  # ---------------- engines ----------------
  piston_engine_lycoming: {lambda_per_h: 1.27e-4, mtbf_h: 7874, kind: published, <<: *atsb,
                           note: "failures OR malfunctions (includes partial power loss) — conservative for total loss"}
  piston_engine_rotax:    {lambda_per_h: 1.56e-4, mtbf_h: 6410, kind: published, <<: *atsb}
  uav_two_stroke_engine:  {lambda_per_h: 1.0e-3, mtbf_h: 1000, kind: assumption,
                           source: "PRESSUPOSTO: small UAV 2-stroke engines lack public field data; set one order of magnitude above the ATSB light-aircraft rates (conservative)",
                           url: "https://www.atsb.gov.au/publications/research-and-analysis-report/2022/aviation/engine-failures-and-malfunctions-light"}
  # ---------------- UAV systems (no authoritative public data) ----------------
  uav_servo:          {lambda_per_h: 5.0e-4, mtbf_h: 2000, kind: vendor_claim,
                       source: "Volz DA 26 datasheet: endurance > 2 000 h (> 3 million cycles); endurance life used as MTBF proxy — PRESSUPOSTO",
                       url: "https://www.volz-servos.com/fileadmin/user_upload/Downloads/Standard/DA-26_Datasheet_uni.pdf"}
  uav_flight_computer: {lambda_per_h: 1.0e-4, mtbf_h: 10000, kind: assumption,
                        source: "PRESSUPOSTO: no public field data for UAV autopilots; replace with supplier MTBF / DO-254 analysis",
                        url: ""}
  uav_generator:      {lambda_per_h: 1.32e-4, mtbf_h: 7600, kind: published, <<: *nasa,
                       note: "GA alternator used as proxy for the UAV engine-driven generator (PRESSUPOSTO of similarity)"}
  backup_battery:     {lambda_per_h: 1.0e-4, mtbf_h: 10000, kind: assumption,
                       source: "PRESSUPOSTO: Li-ion pack + BMS; replace with supplier data", url: ""}
  wiring_harness:     {lambda_per_h: 1.0e-5, mtbf_h: 100000, kind: assumption,
                       source: "PRESSUPOSTO: harness/connector open-circuit per actuator branch; replace with MIL-HDBK-217F connector model", url: ""}
  # GNSS, C2 datalink: deliberately not given — failure conditions that need them stay 'open' (qualitative).
  # To close C2 / replace PRESSUPOSTO FCC or UAV-engine rates, pass certification.safety.supplier_rates
  # with lambda_per_h|mtbf_h + source + retrieved (date). Unsourced numbers are not applied.
