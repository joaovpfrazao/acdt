[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acdt"
version = "0.1.0"
description = "Engineering design framework (aircraft first): open requirements, classical sizing, constraint analysis, aerodynamics, systems and harness selection"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "João Frazão"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "matplotlib>=3.6", "pyyaml>=6.0", "pint>=0.23"]
keywords = ["aircraft design", "aerospace", "UAV", "sizing", "constraint diagram", "MDO"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3", "pytest-cov>=5", "pytest-timeout>=2", "mypy>=1.10", "types-PyYAML"]
# Fases futuras (wrappers opcionais, ver docs/ARCHITECTURE.md)
aero = ["aerosandbox>=4", "neuralfoil"]
mdo = ["openmdao>=3.30", "openaerostruct>=2.7"]
structures = ["pyNastran>=1.3"]
# Fase 4 (alta fidelidade): bibliotecas permissivas importadas. SU2, CalculiX e OpenVSP são executáveis externos
# (instalados pelo utilizador, ver docs/tutorial-fase4.md e THIRD_PARTY.md).
hifi = ["pyNastran>=1.3", "PanelAero>=2025.8", "scipy>=1.10", "kinparse>=1.2"]
# Fase 5 (caixão de asa: FEM de cascas próprio + NeuralFoil + SLSQP). pypardiso (MKL) só acelera o solver linear.
wingbox = ["scipy>=1.10", "neuralfoil"]
fastfem = ["pypardiso>=0.4"]
# Camada AI-native: servidor MCP (SDK oficial, MIT) — `acdt mcp`
ai = ["mcp>=1.10"]
# Fase 10: exportação XLSX da matriz de conformidade (CSV/MD funcionam sem ela).
cert = ["openpyxl>=3.1"]
# Fase 8 (simulador): scipy para trim/linearização. JSBSim (LGPL-2.1) só corre num processo separado
# ($ACDT_JSBSIM_PYTHON), nunca é importado no processo acdt — a extra apenas o instala no mesmo venv.
sim = ["scipy>=1.10", "jsbsim>=1.3"]
# Estrutura em STEP. CadQuery importa OpenCASCADE (LGPL) — só dentro de cad_build.py, noutro processo.
cad = ["cadquery>=2.8,<2.9"]

[project.scripts]
acdt = "acdt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acdt.core" = ["data/*.yaml", "data/*.json"]
"acdt.ai" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["acdt"]

[tool.coverage.report]
skip_empty = true

# mypy gradual (docs/QUALIDADE.md): só a lista `files` é verificada, em modo estrito. As importações de terceiros sem
# tipos são ignoradas; o resto do pacote é seguido em silêncio (os erros dele não contam). Para alargar: acrescentar
# o módulo a `files` depois de o pôr limpo com `mypy --strict`.
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
files = [
  "src/acdt/core/atmosphere.py",
  "src/acdt/core/units.py",
  "src/acdt/core/requirements.py",
  "src/acdt/domains/aircraft/aero/gear_drag.py",
  "src/acdt/core/provenance.py",
  "src/acdt/core/verification.py",
  "src/acdt/domains/aircraft/verification_evaluators.py",
  "src/acdt/domains/aircraft/verification_run.py",
  "src/acdt/core/sensitivity/distributions.py",
  "src/acdt/core/sensitivity/stats.py",
  "src/acdt/core/sensitivity/gsa.py",
  "src/acdt/core/sensitivity/surrogate.py",
  "src/acdt/core/sensitivity/study.py",
  "src/acdt/core/sysmdo/__init__.py",
  "src/acdt/core/sysmdo/expr.py",
  "src/acdt/core/sysmdo/spec.py",
  "src/acdt/core/sysmdo/pareto.py",
  "src/acdt/core/sysmdo/evaluate.py",
  "src/acdt/core/sysmdo/om_problem.py",
  "src/acdt/core/sysmdo/robust.py",
  "src/acdt/core/sysmdo/run.py",
  "src/acdt/core/sysmdo/report.py",
  "src/acdt/core/sysmdo/toy.py",
  "src/acdt/domains/aircraft/mdo_system.py",
  "src/acdt/domains/aircraft/uq_run.py",
  "src/acdt/core/vv.py",
  "src/acdt/core/vv_cases.py",
  "src/acdt/domains/aircraft/vv_cases.py",
]
strict = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_configs = true
