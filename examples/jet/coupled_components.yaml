# All new component inputs are PRESSUPOSTO, not A320 data or fitted OEW.
# Crew/payload/all fuel stay OUTSIDE; dry tanks in fuel_system_dry, engines TOTAL.
configuration_id: illustrative-partial-transport-build-up
aircraft_class: jet_transport
payload_kg: 15000
crew_kg: 800
mass_bounds_kg:
- 40000
- 110000
mtow_limit_kg: 78000
wing_area_m2: 122.6
aspect_ratio: 9.48
mach: 0.79
altitude_m: 11277.6
range_m: 5000000
thrust_sl_N: 120000
n_engines: 2
cd0: 0.02
oswald: 0.82
reserve_fraction: 0.06
wave:
  thickness_ratio: 0.12
  sweep_deg: 25
  technology_factor: 0.95
assumption_sources:
  payload_kg: 'PRESSUPOSTO: study mission payload, not a published A320 number'
  crew_kg: 'PRESSUPOSTO: crew outside component inventory'
  range_m: 'PRESSUPOSTO: design mission, no real-aircraft range validation'
  mtow_limit_kg: 'PRESSUPOSTO: study constraint, not regulatory compliance'
  geometry_and_engine_class: Public class context in examples/jet/a320_ref.json; not
    a matched certified configuration
  cd0: 'PRESSUPOSTO: clean baseline polar, fixed during the solve'
  oswald: 'PRESSUPOSTO: fixed aerodynamic efficiency; only wing/HT/VT structural terms
    modeled'
  wave: 'PRESSUPOSTO: equivalent supercritical strip, half-chord sweep'
weights:
  mode: components
  conventional_metal_transport: true
  configuration_description: 'PRESSUPOSTO: illustrative conventional metal tube-and-wing
    transport, NOT a fitted A320 model'
  ultimate_n: 3.75
  items:
  - name: wing_structure
    covers:
    - wing_structure
    method: raymer_transport_wing
    inputs:
      root_thickness_ratio: 0.14
      taper_ratio: 0.3
      sweep_quarter_chord_deg: 25
      control_area_m2: 25
    source: 'PRESSUPOSTO: illustrative explicit geometry/load/radii; no published
      aircraft weight validation'
  - name: horizontal_tail_structure
    covers:
    - horizontal_tail_structure
    method: raymer_transport_htail
    inputs:
      area_m2: 32
      aspect_ratio: 4.5
      sweep_quarter_chord_deg: 30
      tail_arm_m: 15
      pitch_radius_m: 4.5
      fuselage_width_m: 3.5
      elevator_area_m2: 8
      all_moving: false
    source: 'PRESSUPOSTO: illustrative explicit geometry/load/radii; no published
      aircraft weight validation'
  - name: vertical_tail_structure
    covers:
    - vertical_tail_structure
    method: raymer_transport_vtail
    inputs:
      area_m2: 25
      aspect_ratio: 1.8
      sweep_quarter_chord_deg: 35
      tail_arm_m: 14
      yaw_radius_m: 14
      root_thickness_ratio: 0.12
      tail_height_ratio: 0
    source: 'PRESSUPOSTO: illustrative explicit geometry/load/radii; no published
      aircraft weight validation'
  - name: fuselage_structure
    covers:
    - fuselage_structure
    method: supplied
    mass_kg: 10000
    source: 'PRESSUPOSTO: illustrative TOTAL group mass, not per engine; not OEW-fitted
      or published reference data'
  - name: landing_gear
    covers:
    - landing_gear
    method: supplied
    mass_kg: 2500
    source: 'PRESSUPOSTO: illustrative TOTAL group mass, not per engine; not OEW-fitted
      or published reference data'
  - name: nacelles_pylons
