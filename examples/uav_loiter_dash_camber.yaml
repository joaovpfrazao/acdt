# Fase 9 — demo de camber flaps: UAV elétrico ISR com LOITER LONGO + DASH RÁPIDO.
# Requisitos de dois pontos muito afastados (CL de loiter ~1.0 vs CL de dash ~0.2) — o caso clássico
# em que o camber flap (Thomas 1999 cap. 5; Althaus & Wortmann 1981; Boermans 2006) pode compensar.
# A ferramenta compara none / plain / camber / flaperon e só escolhe camber se o ganho >= min_gain.
# Perfil SD7062 (Selig/Donovan, baixo Re, 14 %) — coordenadas UIUC via AeroSandbox. O FX 67-K-150
# (Althaus & Wortmann) foi testado mas as coordenadas UIUC não convergem de forma fiável no XFOIL
# (clmax 1.19 com metade dos pontos) — ver limitações no tutorial da Fase 9.
name: UAV ISR loiter + dash (demo camber flap)
description: >
  UAV de asa fixa lançado por catapulta e recuperado por paraquedas/rede, com gimbal EO/IR.
  Sem requisito de pista (não há restrição de descolagem/aterragem).
aircraft_class: uav_small
requirements:
  propulsion_type: electric
  regulatory_category: easa_specific
  payload_mass: {target: 4.0, unit: kg}
  endurance: {min: 4.0, unit: h}            # loiter longo
  cruise_speed: {target: 22, unit: m/s}
  max_speed: {min: 70, unit: m/s}     # dash de reposicionamento (PRESSUPOSTO do cenário de demo)
  cruise_altitude: {target: 600, unit: m}
  stall_speed: {max: 17, unit: m/s}   # catapulta + paraquedas: perda não dimensiona (PRESSUPOSTO)
  climb_rate: {min: 3.0, unit: m/s}
  service_ceiling: {min: 3000, unit: m}
  wing_span: {max: 4.2, unit: m}
  mtow: {max: 35, unit: kg}
assumptions:
  weights:
    # Peso vazio estimado por componentes (Raymer 6th ed. Ch. 15 + massas da seleção de sistemas),
    # iterado com o dimensionamento. A estatística é só o valor inicial e o cross-check:
    # Raymer 6th ed. Tab. 3.1 'uav_small' (bateria contada em Wf, não em We).
    method: components
    initial_class: uav_small
    components:
      material: composite
      structural_category: utility       # n_lim 4.4 (lançamento por catapulta / rajada) — PRESSUPOSTO
      landing_gear: none                 # catapulta + paraquedas
      min_areal_density_kg_m2: 0.9       # PRESSUPOSTO de laminado mínimo (pele+núcleo+cola), ver layup
      propeller_mass_kg: 0.08            # EXEMPLO — substituir pelo datasheet
      items:                             # EXEMPLOS rotulados — substituir por massas medidas/datasheet
        - {name: paraquedas de recuperação + ejetor, mass_kg: 1.0}
        - {name: suporte/amortecimento do gimbal, mass_kg: 0.3}
        - {name: datalink C2 + antenas, mass_kg: 0.25, group: equipment}
        - {name: GNSS + bússola (x2), mass_kg: 0.10, group: equipment}
        - {name: pitot/ADS-B, mass_kg: 0.10, group: equipment}
        - {name: cablagem de sinal + conectores, mass_kg: 0.30, group: equipment}
        - {name: ferragens/fixações/pintura, mass_kg: 0.4}
      growth_allowance: 0.10             # PRESSUPOSTO: margem de integração 10 %
  aero:
    fidelity: lowfi                # Fase 2: XFOIL (perfil) + AVL (carga em envergadura); 'handbook' = Raymer
    AR: 14
    taper: 0.6
    tc_root: 0.14
    tc_tip: 0.14
    airfoil: sd7062
    clmax_airfoil: 1.45            # só valor inicial; o lowfi usa a polar XFOIL do perfil
    flap: {kind: plain, flapped_area_ratio: 0.5}
    roughness: smooth_molded_composite
    # asa moldada sem transição forçada: XFOIL prevê a transição natural (e^N, Ncrit 9) — PRESSUPOSTO de
    # superfície limpa (como nos planadores); é aqui que o camber flap ganha (desloca o "balde" laminar)
    laminar: {wing: 1.0, htail: 0.30, vtail: 0.30, fuselage: 0.10}
    extra_drag_areas_m2: {gimbal_eo_ir: 0.006, antennas_pitot: 0.002}
    cfe: 0.0055
    swet_sref: 3.5
  propulsion:
    battery_Wh_kg: 200        # nível de pack (é refinado pela seleção de células)
    eta_total: 0.62           # bateria*ESC*motor*hélice (≈0.95*0.95*0.85*0.80)
    dod: 0.85
    energy_reserve: 0.20
    eta_cruise: 0.80
    eta_climb: 0.75
    systems_power_W: 30       # estimativa inicial; fechada pelo power budget
  geometry:
    fuselage_length_m: 1.8
    fuselage_diameter_m: 0.22
    c_ht: 0.50                # Raymer Table 6.4 (sailplane/homebuilt): 0.50
    c_vt: 0.03
    tail_arm_fraction: 0.55
  constraints:
    ws_initial_psf: 6
  design_options:
    flaps:
      options: [none, plain, camber, flaperon]
      objective: W0            # mínimo MTOW; com dash ≤ 60 m/s o camber NÃO ganha em W0
                               # (cruzamento entre 60 e 70 m/s — ver tutorial-fase9, secção 4)
      min_gain: 0.01           # só escolhe camber/flaperon se ganhar >= 1 % (PRESSUPOSTO)
      camber: {chord_ratio: 0.20, eta_out: 0.65, actuators: 2,
               actuator_mass_kg: 0.06, surface_mass_kg_m2: 0.15, actuator_cost_usd: 60}   # EXEMPLOS — substituir por datasheet
      flaperon: {chord_ratio: 0.20, eta_out: 0.95, actuators: 0, surface_mass_kg_m2: 0.10}
      plain: {kind: plain, flapped_area_ratio: 0.5}
systems:
  bus_cells_series: 8
  cell_chemistry: li_ion
  n_motors: 1
  pack_overhead: 1.20
  propeller: {blades: 2, D_max_m: 0.56, cp_static: 0.05, J_cruise: 0.7, tip_mach_limit: 0.6}
  motor: {power_margin: 1.2, kv_tolerance: 0.30, load_ratio: 0.85, eta_motor: 0.85}
  servos: {v_bus: 8.4, Ch_alpha: -0.25, Ch_delta: -0.60, alpha_deg: 8, delta_deg: 25, factor_of_safety: 1.5}
  autopilot: {min_imu: 3, min_baro: 2, min_can: 1, firmware: ardupilot}
  loads:
    - {name: GNSS + compass (x2), power_w: 1.5}
    - {name: C2 datalink radio, power_w: 6, peak_w: 10}
    - {name: payload EO/IR gimbal, power_w: 15, peak_w: 30, bus: payload}
    - {name: airspeed + ADS-B out, power_w: 2}
  harness: {battery_to_esc_m: 0.4, pdb_to_autopilot_m: 0.3, pdb_to_servo_rail_m: 1.5, max_drop_fraction: 0.03}
  close_loop: true
