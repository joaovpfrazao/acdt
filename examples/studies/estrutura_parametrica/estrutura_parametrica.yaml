# Estudo (applied: false, 24 nov 2026): estrutura paramétrica L1 (docs/ESTRUTURA_PARAMETRICA.md) em exemplos
# convencionais. O bloco structure_layout é aplicado só em memória; os yaml dos exemplos ficam iguais.
applied: false
cases:
  - id: c172
    example: examples/cessna172_check.yaml
    # Lycoming O-320 do C172: 4 cilindros (fator 23.361(c) = 2) — só em memória
    structure_layout: {enabled: true, fittings: {engine_mount: {n_cylinders: 4}}}
  - id: uav150
    example: examples/uav_150kg_stanag4671.yaml
    structure_layout: {enabled: true}
  - id: twin_boom
    example: examples/uav_twin_boom_shortcut.yaml
    structure_layout: {enabled: true}
  # incremento C: acoplamento iterar (massa e CG da estrutura paramétrica no ciclo do W0) — só em memória
  - id: c172_iterar
    example: examples/cessna172_check.yaml
    structure_layout: {enabled: true, coupling: iterar, fittings: {engine_mount: {n_cylinders: 4}}}
  - id: twin_boom_iterar
    example: examples/uav_twin_boom_shortcut.yaml
    structure_layout: {enabled: true, coupling: iterar}
