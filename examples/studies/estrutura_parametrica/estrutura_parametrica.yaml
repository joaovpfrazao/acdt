# Estudo (applied: false, 24 nov 2026): estrutura paramétrica L1 (docs/ESTRUTURA_PARAMETRICA.md) em exemplos
# convencionais. O bloco structure_layout é aplicado só em memória; os yaml dos exemplos ficam iguais.
applied: false
cases:
  - id: c172
    example: examples/cessna172_check.yaml
    # Lycoming O-320 do C172: 4 cilindros (fator 23.361(c) = 2) — só em memória
    structure_layout: {enabled: true, fittings: {engine_mount: {n_cylinders: 4}}}
  - id: uav150
    example: examples/uav_150kg_stanag4671.yaml
    structure_layout: {enabled: true}
  - id: twin_boom
    example: examples/uav_twin_boom_shortcut.yaml
    structure_layout: {enabled: true}
  # incremento C: acoplamento iterar (massa e CG da estrutura paramétrica no ciclo do W0) — só em memória
  - id: c172_iterar
    example: examples/cessna172_check.yaml
    structure_layout: {enabled: true, coupling: iterar, fittings: {engine_mount: {n_cylinders: 4}}}
  - id: twin_boom_iterar
    example: examples/uav_twin_boom_shortcut.yaml
    structure_layout: {enabled: true, coupling: iterar}
  # incremento D: detalhe da fuselagem — portas (aberturas), piso por omissão e pressurização hipotética (o C172
  # real não é pressurizado: 25 kPa só para exercitar o caminho) — só em memória
  - id: c172_detalhe
    example: examples/cessna172_check.yaml
    render: true          # imagem 3-D da estrutura (structure_render.render_layout)
    structure_layout:
      enabled: true
      fittings: {engine_mount: {n_cylinders: 4}}
      fuselage:
        pressure_Pa: 25000.0
        cutouts:
          - {id: porta_esq, x0_m: 1.6, x1_m: 2.5, theta_deg: -90.0, width_deg: 50.0}
          - {id: porta_dir, x0_m: 1.6, x1_m: 2.5, theta_deg: 90.0, width_deg: 50.0}
  - id: twin_boom_detalhe
    example: examples/uav_twin_boom_shortcut.yaml
    render: true
    structure_layout:
      enabled: true
      fuselage:
        section: {w_m: 0.40, h_m: 0.30, n_exp: 3.0}
        floor: {enabled: true, q_Pa: 3000.0}
        cutouts:
          - {id: alcapao_carga, x0_frac: 0.35, x1_frac: 0.55, theta_deg: 180.0, width_deg: 60.0}
