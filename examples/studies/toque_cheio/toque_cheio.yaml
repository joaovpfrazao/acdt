# Estudo de decisão (applied: false, 24 nov 2026): carga lateral do trem principal no toque (14 CFR 23.485) da asa
# voadora sem deriva com a opção (a) da rajada (2× Volz DA 30-HT por folha; `fixed` de
# examples/studies/rajada_cheio/opcao_a.yaml). Nada é aplicado: o yaml do exemplo, o da simulação e os valores por
# omissão ficam iguais. A decisão é do João.
applied: false
example: examples/heavy/uav150_flying_wing_tailless.yaml
fixed_from: examples/studies/rajada_cheio/opcao_a.yaml
simulation: examples/simulation/uav150_tailless_crosswind.yaml
options:
  # (a) aproximação / afundamento no toque: alvo de afundamento da lei de arredondamento (FLARE td_sink 0,3 m/s) e
  #     ângulo da rampa (2° no yaml da simulação)
  a_td_sink_m_s: [0.2, 0.15, 0.1, 0.05]
  a_glide_deg: [1.5, 2.5, 3.0]
  # (b) decrab: altura do início da asa baixa (30 m no yaml da simulação); null → decrab só no arredondamento;
  #     sem decrab → toque caranguejado
  b_decrab_height_m: [60, 45, 20, 10, null]
  b_no_decrab: true
  # (c) bitola: semi-bitola do trem principal (0,48 m no exemplo), com redimensionamento completo
  c_half_track_m: [0.55, 0.60, 0.70, 0.80]
  # (d) fator de projeto da carga lateral das pernas (× 23.485), massa pelo modelo existente
  #     (gear_devices.size_gear_side_load_structure), redimensionado com a massa extra
  d_side_factor: [1.1, 1.2, 1.3, 1.4, 1.5]
