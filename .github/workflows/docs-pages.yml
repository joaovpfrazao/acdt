# Publicar a documentação no GitHub Pages (docs/API.md §5).
# Só corre à mão (workflow_dispatch) ou num push ao main quando a variável do repositório PAGES_ENABLED = "true".
# Antes: Settings → Pages → Source: GitHub Actions. Até lá o job de publicação não é executado.
name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
